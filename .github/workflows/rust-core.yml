name: Rust core CI

on:
  push:
    branches:
      - feat/rust-core-rewrite
    paths:
      - 'TMessagesProj/rust/**'
      - 'TMessagesProj/src/main/assets/dictionary/**'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/cc/**'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/MomoConfig.java'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/util/FilterUtils.java'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/RustCore.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/StrUtil.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/UrlUtil.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/helpers/SecretChatBackupManager.java'
      - 'TMessagesProj/src/main/java/org/telegram/utils/proxy/ProxySettings.java'
      - 'TMessagesProj/build.gradle'
      - 'build.gradle'
      - '.github/workflows/rust-core.yml'
  pull_request:
    branches:
      - lifesupport
    paths:
      - 'TMessagesProj/rust/**'
      - 'TMessagesProj/src/main/assets/dictionary/**'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/cc/**'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/MomoConfig.java'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/util/FilterUtils.java'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/RustCore.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/StrUtil.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/utils/UrlUtil.kt'
      - 'TMessagesProj/src/main/java/moe/hx030/momogram/helpers/SecretChatBackupManager.java'
      - 'TMessagesProj/src/main/java/org/telegram/utils/proxy/ProxySettings.java'
      - 'TMessagesProj/build.gradle'
      - 'build.gradle'
      - '.github/workflows/rust-core.yml'
  workflow_dispatch:

concurrency:
  group: rust-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JNI declaration and export parity
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("TMessagesProj")
          kotlin = (root / "src/main/java/moe/hx030/momogram/utils/RustCore.kt").read_text()
          declared = set(re.findall(r"external fun (native[A-Za-z0-9_]+)", kotlin))

          exported = set()
          for path in (root / "rust/momogram-core/src").glob("jni_*.rs"):
              exported.update(re.findall(
                  r"Java_moe_hx030_momogram_utils_RustCore_(native[A-Za-z0-9_]+)",
                  path.read_text(),
              ))

          missing = sorted(declared - exported)
          extra = sorted(exported - declared)
          if missing or extra:
              raise SystemExit(f"JNI mismatch: missing={missing}, extra={extra}")
          print(f"JNI parity OK: {len(declared)} methods")
          PY
      - name: Verify Rust migration boundaries
        run: |
          python3 - <<'PY'
          import pathlib

          java = pathlib.Path("TMessagesProj/src/main/java")

          removed = [
              "moe/hx030/momogram/cc/AhoCorasickDoubleArrayTrie.java",
              "moe/hx030/momogram/cc/OpenCCUtil.kt",
              "moe/hx030/momogram/cc/CCDict.kt",
          ]
          for rel in removed:
              path = java / rel
              if path.exists():
                  raise SystemExit(f"Legacy implementation returned: {rel}")

          forbidden = {
              "moe/hx030/momogram/util/FilterUtils.java": [
                  "java.util.regex.Pattern", ".matcher(", "CCConverter", "CCTarget",
              ],
              "moe/hx030/momogram/utils/StrUtil.kt": [
                  "java.util.regex.", "Pattern.compile", "UUID.randomUUID",
                  "Random.nextInt", "Character.getDirectionality",
              ],
              "moe/hx030/momogram/utils/UrlUtil.kt": [
                  "queryParameterNames", "getQueryParameter(", "twitterDomains",
                  "trackingQueryPrefixes", "trackingQueryPostfixes",
              ],
              "org/telegram/utils/proxy/ProxySettings.java": [
                  "URLDecoder", "IDN.", "Pattern.compile", "getQueryParameter(",
                  "decodeMarkedWebProxySecretImpl",
              ],
              "moe/hx030/momogram/helpers/SecretChatBackupManager.java": [
                  "javax.crypto", "SecretKeyFactory", "Cipher.getInstance",
                  "SecureRandom", "PBKDF2WithHmacSHA256", "encryptPayload(",
                  "decryptPayload(", "deriveKey(", "serializeBinary(",
                  "deserializeBinary(",
              ],
              "moe/hx030/momogram/cc/CCConverter.kt": [
                  "AhoCorasickDoubleArrayTrie", "OpenCCUtil", "addTrie(",
                  "ApplicationLoader", "ByteArrayOutputStream", "DataOutputStream",
                  "CCDict", "initOpenCc",
              ],
          }

          required = {
              "moe/hx030/momogram/util/FilterUtils.java": [
                  "RustCore.filterPrecheck", "RustCore.filterDecide",
                  "RustCore.filterMatches",
              ],
              "moe/hx030/momogram/utils/StrUtil.kt": [
                  "RustCore.mentionRanges", "RustCore.replaceAllRegex",
                  "RustCore.randomizeFileName",
              ],
              "moe/hx030/momogram/utils/UrlUtil.kt": [
                  "RustCore.cleanUrl", "RustCore.stripAllQueries",
              ],
              "org/telegram/utils/proxy/ProxySettings.java": [
                  "RustCore.parseProxyUri", "RustCore.proxyNormalizeWebAddress",
              ],
              "moe/hx030/momogram/helpers/SecretChatBackupManager.java": [
                  "RustCore.encodeSecretBackup", "RustCore.decodeSecretBackup",
              ],
              "moe/hx030/momogram/cc/CCConverter.kt": [
                  "RustCore.openCcConvert",
              ],
              "moe/hx030/momogram/MomoConfig.java": [
                  "RustCore.filterRegexValid",
              ],
          }

          for rel, needles in forbidden.items():
              source = (java / rel).read_text()
              hits = [needle for needle in needles if needle in source]
              if hits:
                  raise SystemExit(f"Legacy JVM logic found in {rel}: {hits}")

          for rel, needles in required.items():
              source = (java / rel).read_text()
              missing = [needle for needle in needles if needle not in source]
              if missing:
                  raise SystemExit(f"Rust delegation missing in {rel}: {missing}")

          print("Rust migration boundaries OK")
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Test Rust core
        run: cargo test --manifest-path TMessagesProj/rust/momogram-core/Cargo.toml --all-targets

  android-compile:
    name: Android compile with Rust JNI
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize Gradle project submodules
        run: |
          git submodule update --init --depth 1 TMessagesProj_Modules/media
          git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_HOME/ndk/27.2.12479018" > local.properties
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Compile Rust JNI for Android
        run: ./gradlew :TMessagesProj:cargoBuild --stacktrace
      - name: Assemble Android release
        run: ./gradlew :TMessagesProj:assembleRelease --stacktrace
      - name: Verify Rust library packaging
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find TMessagesProj/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            found=0
            for apk in "${apks[@]}"; do
              if unzip -Z1 "$apk" | grep -qx "lib/$abi/libmomogram_core.so"; then
                found=1
                break
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "libmomogram_core.so missing for ABI: $abi" >&2
              exit 1
            fi
          done
      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail
          find TMessagesProj/build/outputs/apk -type f -name '*.apk' -print0 \
            | sort -z \
            | xargs -0 sha256sum > rust-core-apks.sha256
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: momogram-rust-core-apks
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            rust-core-apks.sha256
          if-no-files-found: error
          retention-days: 7
