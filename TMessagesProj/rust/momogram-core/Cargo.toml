[package]
name = "momogram-core"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "momogram_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10.3"
aho-corasick = "1.1.3"
base64 = "0.22.1"
fancy-regex = "0.14.0"
getrandom = "0.2.15"
idna = "1.0.3"
jni = { version = "0.21.1", default-features = false }
once_cell = "1.20.2"
oxixml-unicode = "0.1.2"
pbkdf2 = "0.12.2"
regex = "1.11.1"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.8"
unicode-bidi = "0.3.17"
url = "2.5.4"
uuid = { version = "1.11.0", features = ["v4"] }
